<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="l" filterUnits="userSpaceOnUse" x="0" y="0" width="480" height="160" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0042 0.012" numOctaves="2" seed="5" stitchTiles="stitch" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.0042 0.09" numOctaves="3" seed="8" stitchTiles="stitch" result="fib"/>
      <feDisplacementMap in="fib" in2="warp" scale="36" xChannelSelector="R" yChannelSelector="G" result="wavy"/>
      <feColorMatrix in="wavy" type="luminanceToAlpha" result="L"/>
      <feComponentTransfer in="L" result="b"><feFuncA type="table" tableValues="0 .25 .6 .3 .05 .4 .7 .3 0"/></feComponentTransfer>
      <feFlood flood-color="#7C4820" result="base"/>
      <feFlood flood-color="#43230D"/>
      <feComposite in2="b" operator="in" result="ink"/>
      <feMerge><feMergeNode in="base"/><feMergeNode in="ink"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="160" filter="url(#l)"/>
</svg>