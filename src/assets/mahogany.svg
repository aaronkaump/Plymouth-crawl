<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="g" filterUnits="userSpaceOnUse" x="-60" y="-20" width="1720" height="520" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0004 0.004" numOctaves="2" seed="31" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.0008 0.09" numOctaves="5" seed="34" result="fib"/>
      <feDisplacementMap in="fib" in2="warp" scale="30" xChannelSelector="R" yChannelSelector="G" result="wavy"/>
      <feColorMatrix in="wavy" type="luminanceToAlpha" result="L"/>
      <feComponentTransfer in="L" result="bands"><feFuncA type="table" tableValues="0 .5 1 .5 .1 .6 1 .4 0"/></feComponentTransfer>
      <feFlood flood-color="#6E2210" result="light"/>
      <feFlood flood-color="#240603" result="dark"/>
      <feComposite in="dark" in2="bands" operator="in" result="darkBands"/>
      <feMerge result="wood"><feMergeNode in="light"/><feMergeNode in="darkBands"/></feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.8" numOctaves="1" seed="40" result="pn"/>
      <feColorMatrix in="pn" type="luminanceToAlpha" result="pa"/>
      <feComponentTransfer in="pa" result="pores"><feFuncA type="discrete" tableValues="0 0 0 0 0 0 .5"/></feComponentTransfer>
      <feFlood flood-color="#140402"/>
      <feComposite in2="pores" operator="in" result="poreInk"/>
      <feMerge result="wood2"><feMergeNode in="wood"/><feMergeNode in="poreInk"/></feMerge>
      
      <feTurbulence type="fractalNoise" baseFrequency="0.00035 0.022" numOctaves="1" seed="52" result="rib"/>
      <feColorMatrix in="rib" type="luminanceToAlpha" result="ra"/>
      <feComponentTransfer in="ra" result="ribA"><feFuncA type="table" tableValues="0 0 .06 .2 .06 0 0"/></feComponentTransfer>
      <feFlood flood-color="#E8956A"/>
      <feComposite in2="ribA" operator="in" result="ribbon"/>
      <feMerge result="wood3"><feMergeNode in="wood2"/><feMergeNode in="ribbon"/></feMerge>
      <feGaussianBlur in="wavy" stdDeviation="1.2" result="bump"/>
      <feSpecularLighting in="bump" surfaceScale="2.4" specularConstant="0.6" specularExponent="26" lighting-color="#FFE2C8" result="spec"><feDistantLight azimuth="250" elevation="36"/></feSpecularLighting>
      <feColorMatrix in="spec" type="matrix" values="1 0 0 0 0  0 .85 0 0 0  0 0 .7 0 0  0 0 0 .20 0" result="specSoft"/>
      <feBlend in="specSoft" in2="wood3" mode="screen"/>
    </filter>
  </defs>
  <rect x="-60" y="-20" width="1720" height="520" filter="url(#g)"/>
</svg>